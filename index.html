<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f16">
  <title>Путь офицера</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">ВОЕННАЯ КАРЬЕРА</div>
        <h1>🎖️ ПУТЬ ОФИЦЕРА</h1>
      </div>
      <div class="profile-badge">
        <span>⭐</span>
        <strong id="level">Уровень 1</strong>
      </div>
    </header>

    <main>
      <section class="profile-card">
        <div class="profile-main">
          <div class="avatar">★</div>
          <div class="profile-copy">
            <div class="muted">Текущее звание</div>
            <h2 id="rank">Рядовой</h2>
            <div class="muted" id="rankNext">До следующего звания: 500</div>
          </div>
        </div>
        <div class="progress"><span id="rankProgress"></span></div>
        <div class="profile-stats">
          <span>Тренировок: <b id="clicks">0</b></span>
          <span>Доход: <b id="incomePerMinute">+0 / мин</b></span>
        </div>
      </section>

      <section class="resources">
        <div class="resource"><span>⚡</span><small>Энергия</small><b id="energy">100/100</b></div>
        <div class="resource"><span>💰</span><small>Кредиты</small><b id="credits">12 450</b></div>
        <div class="resource"><span>💠</span><small>Престиж</small><b id="prestige">0</b></div>
        <div class="resource"><span>🏅</span><small>Медали</small><b id="medals">0</b></div>
      </section>

      <div id="notice" class="notice" aria-live="polite">Добро пожаловать, офицер!</div>

      <section
