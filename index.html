<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Путь офицера</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <div class="eyebrow">🎖️ ВОЕННАЯ КАРЬЕРА</div>
        <h1>Путь офицера</h1>
      </div>
      <div class="level">Уровень <span id="level">1</span></div>
    </header>

    <section class="scene">
      <div class="place">📍 <span id="place">Казарма · 1-е отделение</span></div>

      <div class="rank-card">
        <div class="insignia" id="insignia">
          <span class="star">★</span>
          <div class="chevrons"><i></i></div>
        </div>
        <h2 id="rank">Рядовой</h2>
        <p id="description">Первые шаги к большой цели.</p>
      </div>

      <button class="click-button" id="clickButton">
        <span class="click-star">★</span>
        <b>КЛИК</b>
        <small>-1 энергия</small>
      </button>

      <div class="quote">«Дисциплина сегодня — это свобода завтра.»</div>
    </section>

    <aside class="panel">
      <section class="box">
        <div class="box-title"><span>⚡ ЭНЕРГИЯ</span><b><span id="energy">100</span> / <span id="maxEnergy">100</span></b></div>
        <div class="bar"><div id="energyBar"></div></div>
        <div class="hint">Восстановление: +1 каждые 10 сек.</div>
      </section>

      <section class="box">
        <div class="box-title"><span>До следующего звания</span><b><span id="rankProgress">0</span> / <span id="rankNeed">100</span></b></div>
        <div class="bar progress"><div id="rankBar"></div></div>
      </section>

      <section class="stats">
        <div><span>Всего кликов</span><b id="totalClicks">0</b></div>
        <div><span>Макс. энергия</span><b id="maxEnergy2">100</b></div>
        <div><span>Восстановление</span><b>+1 / 10 сек.</b></div>
      </section>

      <section class="box next">
        <div class="mini-rank" id="currentMini"></div>
        <div class="arrow">→</div>
        <div class="mini-rank" id="nextMini"></div>
      </section>
    </aside>

    <section class="ranks" id="ranks"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
